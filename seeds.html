<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seeds | Bonayon</title>
  <meta name="description" content="Vegetable, flower and herb seeds from Bonayon. Order on Amazon.in.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="wrap page-head">
    <h1>Seeds</h1>
    <p>Vegetable, flower and herb seeds to grow from the start.</p>
  </div>
  <div class="wrap page-body">
    <input type="search" class="seed-search" id="search-input" placeholder="Search seeds" aria-label="Search seeds">
    <div id="main-content"><p class="loading">Loading seeds...</p></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script>
  const GROUPS = [
    { key: 'vegetable-seeds', label: 'Vegetable seeds' },
    { key: 'flower-seeds',    label: 'Flower seeds' },
    { key: 'herb-seeds',      label: 'Herb seeds' },
    { key: null,              label: 'Other seeds' }
  ];
  let all = [];

  function render(list) {
    const box = document.getElementById('main-content');
    if (!all.length) { box.innerHTML = '<div class="grid-empty"><h3>No seeds yet</h3><p>We are adding seeds soon. Message us on WhatsApp to ask what is coming.</p></div>'; return; }
    if (!list.length) { box.innerHTML = '<div class="grid-empty"><h3>No seeds match your search</h3></div>'; return; }
    box.innerHTML = GROUPS.map(g => {
      const items = list.filter(p => g.key ? p.subcategory === g.key : !GROUPS.some(x => x.key && x.key === p.subcategory));
      return items.length ? `<section class="sub-block"><h2>${g.label} <span>${items.length}</span></h2><div class="grid">${items.map((p, i) => plantCard(p, i < 4)).join('')}</div></section>` : '';
    }).join('');
  }

  async function load() {
    const { data, error } = await db.from('plants').select('*').eq('category', 'seed').order('created_at', { ascending: false });
    if (error || !data) { document.getElementById('main-content').innerHTML = '<div class="grid-empty"><h3>Could not load seeds</h3><p>Please refresh the page in a moment.</p></div>'; return; }
    all = data; render(all);
  }
  document.getElementById('search-input').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    render(!q ? all : all.filter(p => (p.name || '').toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q)));
  });
  load();
</script>
</body>
</html>
