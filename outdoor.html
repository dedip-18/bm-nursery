<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outdoor plants | Bonayon</title>
  <meta name="description" content="Flowering shrubs, fruit trees, herbs and trees for gardens, terraces and balconies. Order on Amazon.in.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="wrap page-head">
    <h1>Outdoor plants</h1>
    <p>Flowering shrubs, fruit plants, herbs and trees for gardens, terraces and sunny balconies.</p>
  </div>
  <div class="wrap page-body">
    <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
    <p class="count-line" id="count-text"></p>
    <div class="grid" id="plants-grid"><p class="loading">Loading plants...</p></div>
    <div class="grid-more"><button class="btn btn-dark" id="more-btn" type="button" hidden>Show more plants</button></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script>
  const PER_PAGE = 24;
  const CATEGORY = 'outdoor';
  const PAGE_FILE = 'outdoor.html';
  const SUBS = ['flowering', 'fruit', 'herbs-spice', 'trees-shrubs'];
  const active = new URLSearchParams(location.search).get('cat') || 'all';

  async function load() {
    const grid = document.getElementById('plants-grid');
    const { data, error } = await db.from('plants').select('*').eq('category', CATEGORY).order('created_at', { ascending: false });
    if (error || !data) { grid.innerHTML = '<div class="grid-empty"><h3>Could not load plants</h3><p>Please refresh the page in a moment.</p></div>'; return; }

    const chips = [['all', 'All', data.length]].concat(SUBS.map(s => [s, SUB_LABELS[s], data.filter(p => p.subcategory === s).length]));
    document.getElementById('chips').innerHTML = chips.map(([k, l, c]) =>
      `<a class="chip ${k === active ? 'active' : ''}" href="${PAGE_FILE}${k === 'all' ? '' : '?cat=' + k}" ${k === active ? 'aria-current="true"' : ''}>${esc(l)} <span>${c}</span></a>`).join('');

    const list = active === 'all' ? data : data.filter(p => p.subcategory === active);
    const label = active === 'all' ? 'outdoor plants' : (SUB_LABELS[active] || active).toLowerCase();
    document.getElementById('count-text').innerHTML = `<strong>${list.length}</strong> ${label}`;
    let shown = PER_PAGE;
    const more = document.getElementById('more-btn');
    const draw = () => {
      grid.innerHTML = list.length ? list.slice(0, shown).map((p, i) => plantCard(p, i < 4)).join('')
        : `<div class="grid-empty"><h3>Nothing here yet</h3><p>We add new plants often. Check back soon, or message us on WhatsApp.</p></div>`;
      more.hidden = list.length <= shown;
      more.textContent = `Show more plants (${Math.max(list.length - shown, 0)} left)`;
    };
    more.onclick = () => { shown += PER_PAGE; draw(); };
    draw();
  }
  load();
</script>
</body>
</html>
