<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant | Bonayon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="site-header"></div>

<main class="wrap" id="content">
  <p class="loading" style="padding:100px 0">Loading plant details...</p>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script>
  const CATS = {
    indoor:  { label: 'Indoor plants',  href: 'indoor.html' },
    outdoor: { label: 'Outdoor plants', href: 'outdoor.html' },
    seed:    { label: 'Seeds',          href: 'seeds.html' }
  };

  function notFound(msg) {
    document.getElementById('content').innerHTML = `<div class="notfound"><h1>${msg}</h1><p><a href="index.html">Back to all plants</a></p></div>`;
  }

  async function loadPlant() {
    const id = new URLSearchParams(location.search).get('id');
    if (!id) return notFound('Plant not found');
    const { data: p, error } = await db.from('plants').select('*').eq('id', id).single();
    if (error || !p) return notFound('Plant not found');

    const cat = CATS[p.category] || { label: 'All plants', href: 'index.html' };
    const imgs = imgsOf(p);
    const { title, sci } = nameParts(p.name);
    const price = money(p);
    document.title = `${title} | Bonayon`;

    document.getElementById('content').innerHTML = `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><a href="${cat.href}">${cat.label}</a><span>/</span>${esc(title)}</nav>
      <div class="detail">
        <div>
          <div class="gallery-main" id="gmain">
            ${imgs.length ? `<img id="gimg" src="${esc(imgs[0])}" alt="${esc(title)}">` : ''}
            ${imgs.length > 1 ? `<button class="gallery-nav prev" type="button" aria-label="Previous photo">&#8249;</button><button class="gallery-nav next" type="button" aria-label="Next photo">&#8250;</button>` : ''}
          </div>
          ${imgs.length > 1 ? `<div class="thumbs">${imgs.map((u, i) => `<button class="thumb ${i ? '' : 'active'}" type="button" data-i="${i}" aria-label="Photo ${i + 1}"><img src="${esc(u)}" alt=""></button>`).join('')}</div>` : ''}
        </div>
        <div class="info">
          ${SUB_LABELS[p.subcategory] ? `<p class="tagline">${esc(SUB_LABELS[p.subcategory])}</p>` : ''}
          <h1>${esc(title)}</h1>
          ${sci ? `<p class="sci">${esc(sci)}</p>` : ''}
          ${price ? `<p class="price">${price}<small>Price on Amazon.in may change</small></p>` : ''}
          <div class="buy-row">
            ${p.amazon_link ? `<a class="btn btn-primary" href="${esc(p.amazon_link)}" target="_blank" rel="noopener">Buy on Amazon</a>` : ''}
            ${p.flipkart_link ? `<a class="btn btn-flip" href="${esc(p.flipkart_link)}" target="_blank" rel="noopener">Buy on Flipkart</a>` : ''}
            <a class="btn btn-ghost" href="${WA_LINK}?text=${encodeURIComponent('Hi, I have a question about ' + title)}" target="_blank" rel="noopener">Ask on WhatsApp</a>
          </div>
          <p class="desc">${esc(p.description || '')}</p>
          <ul class="promises">
            <li>Packed and dispatched from our nursery in Kolkata</li>
            <li>Wrapped to travel safely across India</li>
            <li>Care questions? We reply on WhatsApp</li>
          </ul>
        </div>
      </div>`;

    if (imgs.length > 1) {
      let i = 0;
      const img = document.getElementById('gimg');
      const go = n => {
        i = (n + imgs.length) % imgs.length; img.src = imgs[i];
        document.querySelectorAll('.thumb').forEach((t, k) => t.classList.toggle('active', k === i));
      };
      document.querySelector('.gallery-nav.prev').addEventListener('click', () => go(i - 1));
      document.querySelector('.gallery-nav.next').addEventListener('click', () => go(i + 1));
      document.querySelectorAll('.thumb').forEach(t => t.addEventListener('click', () => go(Number(t.dataset.i))));
      let x0 = 0; const gm = document.getElementById('gmain');
      gm.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
      gm.addEventListener('touchend', e => { const d = x0 - e.changedTouches[0].clientX; if (Math.abs(d) > 40) go(i + (d > 0 ? 1 : -1)); });
    }
  }
  loadPlant();
</script>
</body>
</html>
